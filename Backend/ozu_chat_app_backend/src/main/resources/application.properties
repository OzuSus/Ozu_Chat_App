spring.application.name=ozu-chat-app-backend
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ozu_chat_app}
spring.data.mongodb.auto-index-creation=true

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:35MB}

ozu.app.frontend-url=${FRONTEND_URL:http://localhost:5173}
ozu.app.backend-url=${BACKEND_URL:http://localhost:8080}
ozu.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
ozu.jwt.access-secret=${JWT_ACCESS_SECRET:dev-access-secret-change-me-with-at-least-32-characters}
ozu.jwt.refresh-secret=${JWT_REFRESH_SECRET:dev-refresh-secret-change-me-with-at-least-32-characters}
ozu.jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:15}
ozu.jwt.refresh-token-days=${JWT_REFRESH_TOKEN_DAYS:30}
ozu.email.verification-token-minutes=${EMAIL_VERIFICATION_TOKEN_MINUTES:30}
ozu.upload.directory=${UPLOAD_DIRECTORY:uploads}
ozu.rate-limit.requests-per-minute=${RATE_LIMIT_REQUESTS_PER_MINUTE:120}
